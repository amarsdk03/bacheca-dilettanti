<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codice di verifica</title>
  </head>
  <body style="margin:0;background:#fafafa;color:#171717;font-family:Arial,sans-serif">
    <div style="max-width:560px;margin:0 auto;padding:40px 24px">
      <div style="border:1px solid #e5e5e5;border-radius:16px;background:#ffffff;padding:32px">
        <h1 style="margin:0 0 16px;font-size:24px">Verifica il tuo indirizzo email</h1>
        <p style="margin:0 0 24px;line-height:1.6">
          Inserisci questo codice nella schermata di verifica per continuare.
        </p>
        <p style="margin:0 0 24px;font-size:32px;font-weight:700;letter-spacing:8px;color:#a21caf">
          {{ .Token }}
        </p>
        <p style="margin:0;color:#737373;font-size:14px;line-height:1.5">
          Se non hai richiesto tu il codice, puoi ignorare questa email.
        </p>
      </div>
    </div>
  </body>
</html>
